# dx_app checks (SP6 U-16).
#
# checks: every repository check that needs no NPU, through the one entry
#   point developers run too: bash scripts/ci_checks.sh. The hosted runner
#   has no dxrt, so header-odr, cxx14-headers and cross-compile report SKIP
#   there. DXAPP_CHECKS_RUNNER may name another runner; pull requests from
#   a fork always stay on ubuntu-24.04, so a fork's code never reaches it.
# npu: opt-in, off by default. On a self-hosted runner with DX-RT and a
#   DX-M1 it builds dx_app, then runs graph_engine_test, common_unit_test
#   and the graph trio. How to enable it: docs/source/docs/
#   04_DX-APP_CPP_Example_Test.md, "Repository checks (GitHub Actions)".
name: dxapp-checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks (no dxrt, no NPU)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.DXAPP_CHECKS_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # nothing pushes; keep the token out of .git/config
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilers and CMake (GitHub-hosted runners)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ cmake make
      - name: Python test tools
        run: python -m pip install pytest pyyaml requests
      - name: Let git trust the checkout
        # tests/scripts lists the tracked files with git to prove it leaves
        # them alone; in a container runner git refuses a checkout owned by
        # another user ("dubious ownership") and that list would be empty.
        # Added once only: a self-hosted runner's ~/.gitconfig persists.
        run: git config --global --get-all safe.directory | grep -qxF "$GITHUB_WORKSPACE" || git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: scripts/ci_checks.sh
        run: bash scripts/ci_checks.sh

  npu:
    name: NPU tests (self-hosted, opt-in)
    needs: checks
    # Off unless the repository variable DXAPP_NPU_CI is 'true'. Never on
    # pull_request: a self-hosted runner must not run code from a fork.
    if: >-
      vars.DXAPP_NPU_CI == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')))
    runs-on: [self-hosted, linux, x64, dxapp-npu]
    timeout-minutes: 240
    concurrency:
      group: dxapp-npu
      cancel-in-progress: false
    env:
      DXAPP_PYTHON: ${{ vars.DXAPP_NPU_PYTHON }}
      DX_RUNTIME_DIR: ${{ vars.DXAPP_NPU_RUNTIME_DIR }}
      DXAPP_ASSETS_DIR: ${{ vars.DXAPP_NPU_ASSETS_DIR }}
    # Every NPU run is under `timeout`: a hung hardware case must fail its
    # step, not hold the shared NPU runner until timeout-minutes.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # a persistent self-hosted host
      - name: NPU sanity check (judged by its text, not its exit code)
        run: |
          out=$(timeout --kill-after=30 600 bash "$DX_RUNTIME_DIR/scripts/sanity_check.sh" --dx_rt 2>&1) || true
          printf '%s\n' "$out"
          grep -q 'Sanity check PASSED!' <<< "$out"
          if grep -q '\[ERROR\]' <<< "$out"; then exit 1; fi
      - name: Checks that need the dxrt headers
        run: PYTHON="$DXAPP_PYTHON" bash scripts/ci_checks.sh --require-dxrt --only header-odr,cxx14-headers
      - name: Models and videos from the runner
        run: |
          [ -d "$DXAPP_ASSETS_DIR" ] || { echo "set the repository variable DXAPP_NPU_ASSETS_DIR"; exit 1; }
          ln -sfn "$DXAPP_ASSETS_DIR" assets
      - name: Build and install into bin/
        run: |
          cmake -S . -B build_x86_64 -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain.x86_64.cmake \
                -DCMAKE_BUILD_TYPE=release -DDXAPP_PYTHON="$DXAPP_PYTHON"
          ninja -C build_x86_64
          cmake --build build_x86_64 --target install
          cp -r build_x86_64/release/* ./
          cp build_x86_64/src/cpp_example/graph_engine_test build_x86_64/src/cpp_example/common_unit_test bin/
      - name: graph_engine_test and common_unit_test
        run: |
          timeout --kill-after=60 1800 ./build_x86_64/src/cpp_example/graph_engine_test | tee graph_engine_test.log
          tail -n 1 graph_engine_test.log | grep -Eq ' 0 failures, 0 skipped$'
          timeout --kill-after=60 600 ./build_x86_64/src/cpp_example/common_unit_test | tee common_unit_test.log
          tail -n 1 common_unit_test.log | grep -Eq ' 0 failures,'
      - name: Graph trio
        run: >-
          timeout --kill-after=60 3600 "$DXAPP_PYTHON" -m pytest -q
          tests/cpp_example/test_graph_engine.py
          tests/cpp_example/test_graph_cli.py
          tests/cpp_example/test_graph_python.py
