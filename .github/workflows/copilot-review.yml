name: Copilot PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  copilot-review:
    name: Copilot PR Review Dispatch
    if: |-
      (
        github.event_name == 'pull_request' &&
        github.event.sender.type == 'User'
      ) || (
        github.event.sender.type == 'User' &&
        (
          (github.event_name == 'issue_comment' &&
           github.event.issue.pull_request &&
           startsWith(github.event.comment.body, '@copilot')) ||
          (github.event_name == 'pull_request_review_comment' &&
           startsWith(github.event.comment.body, '@copilot')) ||
          (github.event_name == 'pull_request_review' &&
           startsWith(github.event.review.body, '@copilot'))
        )
      )
    runs-on:
      - self-hosted
    env:
      DISPATCH_REPO: sangminkang/copilot_review
      COPILOT_REVIEW_ACTION_TOKEN: ${{ secrets.ATD_COPILOT_REVIEW_ACTION_TOKEN }}
    steps:
      - name: Dispatch to copilot_review
        id: dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF_PR: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER_PR: ${{ github.event.pull_request.number }}
          PR_NUMBER_ISSUE: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GITHUB_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body || github.event.review.body }}
        run: |
          set -euo pipefail

          # Determine PR number
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            PR_NUMBER="$PR_NUMBER_ISSUE"
          else
            PR_NUMBER="$PR_NUMBER_PR"
          fi

          # Fetch head_ref via API for issue_comment (github.event.pull_request is null)
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            HEAD_REF=$(curl -s -f -m 30 \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://gh.deepx.ai/api/v3/repos/$REPOSITORY/pulls/$PR_NUMBER" | jq -re '.head.sha')
          else
            HEAD_REF="$HEAD_REF_PR"
          fi

          # Extract text after @copilot as additional context
          ADDITIONAL_CONTEXT=$(echo "$COMMENT_BODY" | sed 's/^@copilot[[:space:]]*//' | sed 's/^review[[:space:]]*//')

          # Generate unique correlation ID and record timestamp before dispatch
          CORRELATION_ID="${REPO_NAME}-${PR_NUMBER}-$(date +"%Y-%m-%d_%H:%M:%S")"
          DISPATCH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          jq -n \
            --arg repo "$REPOSITORY" \
            --arg owner "$REPO_OWNER" \
            --arg name "$REPO_NAME" \
            --argjson pr_num "$PR_NUMBER" \
            --arg ref "$HEAD_REF" \
            --arg gh_token "$GITHUB_TOKEN" \
            --arg additional_context "$ADDITIONAL_CONTEXT" \
            --arg correlation_id "$CORRELATION_ID" \
            '{event_type: "copilot-review", client_payload: {repository: $repo, repository_owner: $owner, repository_name: $name, pull_request_number: $pr_num, head_ref: $ref, gh_token: $gh_token, additional_context: $additional_context, correlation_id: $correlation_id}}' | \
          curl -m 30 -f -X POST \
            -H "Authorization: token $COPILOT_REVIEW_ACTION_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            https://gh.deepx.ai/api/v3/repos/$DISPATCH_REPO/dispatches \
            --data-binary @-

          # Poll for the run triggered by this dispatch — match by correlation_id in display_title
          echo "Waiting for dispatched workflow run to appear (correlation_id: $CORRELATION_ID)..."
          RUN_ID=""
          for i in $(seq 1 12); do
            sleep 5
            RUN_ID=$(curl -s -f -m 30 \
              -H "Authorization: token $COPILOT_REVIEW_ACTION_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://gh.deepx.ai/api/v3/repos/$DISPATCH_REPO/actions/runs?event=repository_dispatch&created=>=$DISPATCH_TIME" \
              | jq -re --arg cid "$CORRELATION_ID" '.workflow_runs[] | select(.display_title | contains($cid)) | .id // empty' | head -1 || true)
            if [ -n "$RUN_ID" ]; then
              echo "Found dispatched run: $RUN_ID"
              break
            fi
            echo "Attempt $i: run not found yet..."
          done

          if [ -z "$RUN_ID" ]; then
            echo "Warning: could not determine dispatched run ID" >&2
          fi
          echo "dispatch_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Acknowledge request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          DISPATCH_RUN_ID: ${{ steps.dispatch.outputs.dispatch_run_id }}
          LOG_URL: ${{ steps.dispatch.outputs.dispatch_run_id != '' && format('{0}/{1}/actions/runs/{2}', github.server_url, env.DISPATCH_REPO, steps.dispatch.outputs.dispatch_run_id) || format('{0}/{1}/actions', github.server_url, env.DISPATCH_REPO) }}
        run: |
          set -euo pipefail
          payload=$(jq -n --arg body "🤖 안녕하세요 @${ACTOR}님, 요청을 받았습니다. 지금 코드 리뷰를 시작하겠습니다! 진행 상황은 [로그](${LOG_URL})에서 확인하실 수 있습니다." '{body:$body}')
          curl -s -f -m 30 -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "${payload}" \
            https://gh.deepx.ai/api/v3/repos/${REPOSITORY}/issues/${ISSUE_NUMBER}/comments \
            || { echo "Failed to post acknowledge comment" >&2; exit 1; }

      - name: Polling copilot_review until finish
        timeout-minutes: 60
        env:
          DISPATCH_RUN_ID: ${{ steps.dispatch.outputs.dispatch_run_id }}
          DISPATCH_REPO: ${{ env.DISPATCH_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$DISPATCH_RUN_ID" ]; then
            echo "No run ID available, skipping poll."
            exit 0
          fi
          echo "Polling run $DISPATCH_RUN_ID for completion..."
          while true; do
            sleep 10
            status=$(curl -s -f -m 30 \
              -H "Authorization: token ${COPILOT_REVIEW_ACTION_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://gh.deepx.ai/api/v3/repos/${DISPATCH_REPO}/actions/runs/${DISPATCH_RUN_ID}" \
              | jq -re '.status' || true)
            echo "Run status: $status"
            if [ "$status" = "completed" ]; then
              conclusion=$(curl -s -f -m 30 \
                -H "Authorization: token ${COPILOT_REVIEW_ACTION_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://gh.deepx.ai/api/v3/repos/${DISPATCH_REPO}/actions/runs/${DISPATCH_RUN_ID}" \
                | jq -re '.conclusion' || true)
              echo "Run conclusion: $conclusion"
              if [ "$conclusion" != "success" ]; then
                echo "Review run did not succeed (conclusion: $conclusion)" >&2
                exit 1
              fi
              echo "Review completed successfully!"
              break
            fi
          done
