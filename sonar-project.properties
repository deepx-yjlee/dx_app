sonar.projectKey=deepx_dx_app_AZZXDMxmgP_2ECN7V4UL

# Analysis scope
# sonar.tests MUST be declared. Without it every file -- tests/ included -- is
# indexed as main source, so test code is analysed with production rules and the
# sonar.test.exclusions below silently matches nothing (it only applies to files
# already classified as tests). tests/** is listed in sonar.exclusions as well so
# the same files are never indexed twice ("File can't be indexed twice").
sonar.sources=.
sonar.tests=tests
sonar.exclusions=third_party/**,tests/**
sonar.cfamily.build-wrapper-output=bw-output

# Coverage configuration
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverageReportPaths=coverage_cpp.xml

# Test exclusions (files that are not test targets)
sonar.test.exclusions=**/test/**,**/*test*/**,extern/**

# Coverage exclusions (files left out of coverage)
sonar.coverage.exclusions=**/test/**,**/*test*/**,extern/**,docs/**,cmake/**,sample/**,example/**,scripts/**,**/__init__.py,**/factory/**

# Duplication exclusions (files left out of duplication)
sonar.cpd.exclusions=**/factory/**,**/__init__.py,scripts/**

# Language configuration
sonar.python.version=3.11

# Analysis configuration
sonar.sourceEncoding=UTF-8
